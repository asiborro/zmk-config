  # Battery history: 5 minutes. Trackball diagnostics: 10 seconds.
  # Scraping only reads cached data and does not perform Bluetooth operations.
  - job_name: peamk-battery
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:19108']
        labels: { instance: mini, keyboard: PeaMK }
