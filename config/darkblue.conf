# darkblue: independently editable keyboard configuration.
CONFIG_ZMK_KEYBOARD_NAME="darkblue"

# Cosmos Lemon Wireless Configuration

# External Power (for LEDs)
CONFIG_ZMK_EXT_POWER=y

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=180
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Darken the LEDs after one minute idle; activity restores the saved RGB state.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Keep the LED power rail independent of saved RGB state. On the Lemon
# board, ext_power controls LED_PWR; the VIK sensor uses a separate 3.3V rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Mouse keys
CONFIG_ZMK_POINTING=y

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Keep host and split links on 1M. The nRF52840 controller defaults 2M on,
# so removing a previous '=y' override did not disable PHY negotiation.
CONFIG_BT_CTLR_PHY_2M=n

# Deep sleep (battery saving)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Read-only diagnostics; VDDH is supply voltage, not cell voltage on USB.
CONFIG_KEYBOARD_BATTERY_TELEMETRY=y

# USB logging (disable for production)
# CONFIG_ZMK_USB_LOGGING=y
