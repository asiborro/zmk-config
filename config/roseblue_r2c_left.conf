# Left side (central); keyboard and bootloader combo work without the right half.
CONFIG_SPI=y

# Relay the right peripheral's battery through the left host connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Buffer forwarded trackball motion while Bluetooth drains the queues.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=40

# Request 7.5 ms host connection events (1.25 ms units).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_EXT_POWER=y
