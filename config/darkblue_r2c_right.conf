# Right side (central) with trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PEAMK_TRACKBALL_TELEMETRY=y
CONFIG_ZMK_POINTING=y

# Reduce active radio power on the central, which sends continuous pointer
# reports as well as maintaining the split connection. The shared config's
# +8 dBm remains on the left; +4 dBm trades some range for lower TX current.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Relay the left peripheral's battery through the right half's host connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Trackball tuning for BLE: default 250 Hz polling is too fast for BLE
# 15 ms conn interval — drop to 125 Hz and grow the mouse report queue so
# bursts don't overflow while the BT stack drains.
CONFIG_PMW3610_POLLING_RATE_125=y
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
