# Used only by the right-debug build. Keep USB logging out of normal
# battery firmware because it changes power consumption.
# This driver registers its logger with CONFIG_INPUT_LOG_LEVEL.
CONFIG_INPUT_LOG_LEVEL_DBG=y
# Allow the serial console to reconnect after reset before emitting the
# buffered sensor initialization messages.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
