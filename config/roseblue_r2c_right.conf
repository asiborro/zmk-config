# Right side (central) with Skree PAW3395 VIK sensor and USB startup logs.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3395=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_USB=y

# CPI is set in the sensor devicetree node. Rate-limit motion reports to 8 ms
# (at most 125 Hz); this driver reads motion on interrupts rather than polling.
CONFIG_PAW3395_REPORT_INTERVAL_MIN=8
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40

# Relay the left peripheral's battery through the right host connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Request 7.5 ms host connection events (1.25 ms units).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
