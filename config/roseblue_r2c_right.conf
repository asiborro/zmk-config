# Right side (central) with trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
# Native sensitivity; normal pointer movement uses 1:1 scaling.
CONFIG_PMW3610_CPI=600
CONFIG_PEAMK_TRACKBALL_TELEMETRY=y
CONFIG_ZMK_POINTING=y

# Relay the left peripheral's battery through the right half's host connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Use 125 Hz sensor updates (nominally every 8 ms).
# Keep room for bursts while the Bluetooth stack drains the mouse queue;
# actual host report timing depends on the negotiated connection interval.
CONFIG_PMW3610_POLLING_RATE_125=y
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40

# Request 7.5 ms host connection events to reduce pointer report batching.
# These values use 1.25 ms units; the host decides the actual interval.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
