# Right side (peripheral) with trackball and local USB diagnostics.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
# Native sensitivity; normal pointer movement uses 1:1 scaling.
CONFIG_PMW3610_CPI=600
CONFIG_KEYBOARD_TRACKBALL_TELEMETRY=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_USB=n

# Use 125 Hz sensor updates (nominally every 8 ms).
# Keep room for motion bursts on the inter-half Bluetooth connection.
CONFIG_PMW3610_POLLING_RATE_125=y
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=40

# RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
