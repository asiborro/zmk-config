name: Build ZMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      board:
        description: "Controller revision (check the PCB marking)"
        type: choice
        default: cosmos_lemon_wireless
        options:
          - cosmos_lemon_wireless
          - cosmos_lemon_wireless_v4

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read build.yaml
        id: matrix
        run: echo "builds=$(yq -o=json -I=0 build.yaml)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    container:
      # ZMK v0.3 uses Zephyr 3.5; do not follow a moving stable container.
      image: zmkfirmware/zmk-build-arm:3.5@sha256:0979a8de325e3d822e48bd8d1d9efaee2984ad3750253119f920a342f0ce5cde
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      BOARD: ${{ inputs.board || matrix.board }}
      SHIELD: ${{ matrix.shield }}
      SNIPPET: ${{ matrix.snippet }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache west modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            zmk-pmw3610-driver/
          key: west-zephyr-3.5-${{ hashFiles('config/west.yml', 'config/deps.yml') }}

      - name: West init
        run: west init -l config

      - name: West update
        run: west update --fetch-opt=--filter=tree:0

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build firmware
        shell: bash
        run: |
          west_args=()
          cmake_args=()
          if [ -n "$SNIPPET" ]; then
            west_args+=(-S "$SNIPPET")
            cmake_args+=(-DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/config/diagnostics.conf")
          fi
          west build -s zmk/app -b "$BOARD" "${west_args[@]}" -- \
            -DSHIELD="$SHIELD" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config" \
            "${cmake_args[@]}"

      - name: Record resolved dependency revisions
        run: python3 scripts/freeze-manifest.py > build/manifest-frozen.yml

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ env.BOARD }}
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/zephyr.dts
            build/zephyr/.config
            build/manifest-frozen.yml
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
