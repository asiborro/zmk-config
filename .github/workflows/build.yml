name: Build ZMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      board:
        description: "Controller revision (check the PCB marking)"
        type: choice
        default: cosmos_lemon_wireless
        options:
          - cosmos_lemon_wireless
          - cosmos_lemon_wireless_v4

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install matrix reader dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check battery readers and monitoring
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Read build.yaml
        id: matrix
        run: echo "builds=$(python3 scripts/build-firmware.py --list | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    container:
      # ZMK v0.3 uses Zephyr 3.5; do not follow a moving stable container.
      image: zmkfirmware/zmk-build-arm:3.5@sha256:0979a8de325e3d822e48bd8d1d9efaee2984ad3750253119f920a342f0ce5cde
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      BOARD: ${{ inputs.board || matrix.board }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache west modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            zmk-pmw3610-driver/
          key: west-zephyr-3.5-${{ hashFiles('config/west.yml', 'config/deps.yml', 'patches/*.patch') }}

      - name: West init
        run: west init -l config

      - name: West update
        run: west update --fetch-opt=--filter=tree:0

      - name: Test PMW3610 startup recovery and passive quality cache
        if: matrix.artifact == 'darkblue-right'
        run: |
          python3 scripts/check-pmw3610-startup.py zmk-pmw3610-driver
          python3 scripts/check-pmw3610-clock.py zmk-pmw3610-driver
          python3 scripts/check-pmw3610-quality.py zmk-pmw3610-driver
          python3 scripts/check-trackball-usb.py

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build firmware
        run: python3 scripts/build-firmware.py --no-update --artifact "$ARTIFACT" --board "$BOARD"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ env.BOARD }}
          path: |
            artifacts/${{ matrix.artifact }}-${{ env.BOARD }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
